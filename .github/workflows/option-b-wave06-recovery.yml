# Historical/manual reproduction. Current automatic coverage: ci.yml.
name: Option B Wave 6 recovery contract research
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  offline-failure-and-recovery-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run twenty deterministic recovery failure cases
        run: python -m unittest discover -s docs/research/experiments -p 'test_wave06_recovery_contract.py' -v
      - name: Regress ten supported portable project backup cases
        run: python -m unittest discover -s docs/research/experiments -p 'test_pair03_portability.py' -v
