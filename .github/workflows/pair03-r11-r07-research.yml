name: Pair 03 R11 portability and R07 profiles research

on:
  pull_request:
    paths:
      - "docs/research/experiments/pair03_*"
      - "docs/research/experiments/test_pair03_*"
      - ".github/workflows/pair03-r11-r07-research.yml"
  push:
    paths:
      - "docs/research/experiments/pair03_*"
      - "docs/research/experiments/test_pair03_*"
      - ".github/workflows/pair03-r11-r07-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-text-and-temporal-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: R11 TXT/archive and R07 multi-scene deterministic checks
        run: |
          python -m unittest discover -s docs/research/experiments -p 'test_pair03_*.py' -v
          # Retain and regress the existing 20 source-gating tests as well.
          python -m unittest discover -s docs/research/experiments -p 'test_r07_story_state_contract.py' -v

  calibre-docx-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install no-paid Calibre engine and python-docx from Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends calibre python3-docx
      - name: Calibre synthetic DOCX -> EPUB -> DOCX fidelity probe
        run: |
          command -v ebook-convert
          /usr/bin/python3 docs/research/experiments/pair03_calibre_probe.py
