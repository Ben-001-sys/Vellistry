# Historical/manual reproduction. Current automatic coverage: ci.yml.
name: R01 source-variant manifest validation

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  synthetic-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test version-aware source parser (synthetic-only, no author source upload)
        run: python -m unittest discover -s tests -p "test_r01_*.py" -v
