name: R01 review packet research tests

on:
  pull_request:
    paths:
      - "scripts/r01_manifest.py"
      - "scripts/r01_review_packet.py"
      - "scripts/r01_mapping_proposal.py"
      - "tests/test_r01_review_packet.py"
      - "tests/test_r01_mapping_proposal.py"
      - ".github/workflows/r01-review-packet.yml"
  push:
    paths:
      - "scripts/r01_manifest.py"
      - "scripts/r01_review_packet.py"
      - "tests/test_r01_review_packet.py"
      - ".github/workflows/r01-review-packet.yml"

jobs:
  review-packet-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source variants and explicit mapping boundaries (synthetic only)
        run: |
          python -m unittest discover -s tests -p "test_r01_review_packet.py" -v
          python -m unittest discover -s tests -p "test_r01_mapping_proposal.py" -v
