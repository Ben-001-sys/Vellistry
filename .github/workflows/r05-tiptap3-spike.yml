name: R05 Tiptap3 isolated editor spike
on:
  pull_request:
    paths:
      - 'docs/research/spikes/tiptap3-headless/**'
      - '.github/workflows/r05-tiptap3-spike.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/spikes/tiptap3-headless/**'
      - '.github/workflows/r05-tiptap3-spike.yml'
permissions:
  contents: read
jobs:
  editor-spike:
    name: Tiptap 3 headless editing behavior (nonproduction)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: docs/research/spikes/tiptap3-headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies (not an application dependency decision)
        run: npm install --no-audit --no-fund
      - name: Show exact dependency versions
        run: npm ls @tiptap/core @tiptap/pm @tiptap/starter-kit jsdom --depth=0
      - name: Execute actual Tiptap 3 jsdom smoke tests
        run: npm test
