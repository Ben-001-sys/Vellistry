# Historical/manual reproduction. Current automatic coverage: ci.yml.
name: R06 synthetic research contract
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  synthetic-contract:
    name: Validate simulated request inclusion and isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run R06 synthetic contract tests — not model quality tests
        run: python docs/research/experiments/r06_synthetic_request_simulator.py
