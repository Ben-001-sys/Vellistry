name: R18 Tiptap browser recovery comparison

on:
  pull_request:
    paths:
      - "docs/research/spikes/r18-framework-slice/**"
      - ".github/workflows/r18-browser-recovery.yml"
      - "docs/reports/R18-BROWSER-WRITING-AND-DRAFT-RECOVERY-2026-10-09.md"
  push:
    paths:
      - "docs/research/spikes/r18-framework-slice/**"
      - ".github/workflows/r18-browser-recovery.yml"
      - "docs/reports/R18-BROWSER-WRITING-AND-DRAFT-RECOVERY-2026-10-09.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vellistry_frameworks
          POSTGRES_USER: vellistry
          POSTGRES_PASSWORD: synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vellistry -d vellistry_frameworks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: docs/research/spikes/r18-framework-slice

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install community packages
        run: npm install --no-audit --no-fund
      - name: Install Chromium for real browser testing
        run: npx playwright install --with-deps chromium
      - name: Seed synthetic two-owner database
        env:
          DATABASE_URL: postgresql://vellistry:synthetic-only@127.0.0.1:5432/vellistry_frameworks
        run: npm run seed
      - name: Test authoring and IndexedDB recovery through both frontends
        env:
          DATABASE_URL: postgresql://vellistry:synthetic-only@127.0.0.1:5432/vellistry_frameworks
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "1"
        run: |
          ./node_modules/.bin/next dev apps/next --hostname 127.0.0.1 --port 3100 >next.log 2>&1 &
          NEXT_PID=$!
          ./node_modules/.bin/tsx --tsconfig apps/nest/tsconfig.json apps/nest/api.ts >nest.log 2>&1 &
          NEST_PID=$!
          ./node_modules/.bin/vite --config apps/vite/vite.config.mjs >vite.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            echo '--- NEXT LAST LINES ---'; tail -45 next.log || true
            echo '--- NEST LAST LINES ---'; tail -45 nest.log || true
            echo '--- VITE LAST LINES ---'; tail -45 vite.log || true
            kill "$NEXT_PID" "$NEST_PID" "$VITE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for port in 3100 3101 5173; do
            ready=0
            for attempt in $(seq 1 100); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/" ||
                [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/books/book-a/chapters/chapter-1")" = "401" ]; then
                  ready=1
                  break
              fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then
              echo "service at $port failed to become ready"
              exit 1
            fi
          done
          npm run test:browser
      - name: Collect browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r18-browser-recovery-traces
          path: docs/research/spikes/r18-framework-slice/test-results/
          retention-days: 7
