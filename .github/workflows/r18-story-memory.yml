# Historical/manual reproduction. Current automatic coverage: ci.yml.
name: R18 synthetic story memory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run synthetic no-dependency memory tests
        run: node --test docs/research/spikes/r18-fiction-memory/memory.test.mjs
