id: "VEL-TASK-0010"
title: "Integrate Vellistry product-language candidate and agent guidance"
type: "implementation-task"
status: "in-progress"
created_at: "2026-10-17"
updated_at: "2026-10-17"
owner: "project_owner"
context_pack_id: "VEL-CP-0010"
objective: "Implement the owner's 2026-10-17 explicit in-chat authorization to place the completed Vellistry LANGUAGE.md candidate in the repository and integrate its scoped AGENTS.md instructions. ChatGPT is explicitly the direct executor for this bounded documentation change; preserve the Codex-default policy for other tasks. Do not infer that owner approval of every proposed label, or permission to merge or release, was granted."
in_scope:
- "New root LANGUAGE.md copied exactly from the delivered 2026-10-17 candidate, maintaining proposed-owner-review status and original evidence limitations"
- "Append a concise product-language section to existing AGENTS.md without replacing Codex/owner/security controls"
- "Task0010, immutable CP0010 and EB0010 handoff records, isolated documentation branch and draft PR review"
out_of_scope:
- "UI implementation, feature names in source code, database/API identifiers, SQL, migrations, CI/validators or other product source files"
- "Promotion of proposed terminology to accepted, product scope changes, hosted/cloud operations, author manuscripts, secrets or paid calls"
- "Merging the draft PR, deployment, release, altering unrelated PRs or replacing approved agent-executor policy"
inputs:
- path: "PROJECT-CONSTITUTION.md"
  role: "accepted-owner-authority"
- path: "SOURCE-OF-TRUTH.md"
  role: "accepted-knowledge-governance"
- path: "AGENTS.md"
  role: "current-agent-execution-contract"
- path: "docs/agent-workflow/README.md"
  role: "immutable-task-pack-bundle-protocol"
- path: "docs/requirements/MVP-SCOPE-DECISION-2026-10-09.md"
  role: "approved-product-scope"
- path: "docs/decisions/ADR-0007-immutable-compact-expanded-guidance-sources.md"
  role: "accepted-original-rule-provenance"
source_gaps:
- id: "OWNER-LABELS"
  limitation: "The owner authorized repository implementation of the candidate, not semantic approval of the 15 unresolved terminology decisions; keep proposed-owner-review metadata."
- id: "PROVENANCE"
  limitation: "Owner instruction is present in this conversation; persistent public permalink is not available. Record actual executor as ChatGPT, not Codex."
- id: "DESIGN"
  limitation: "New direct Figma audit unavailable because connected tool limit was reached; source handoff reports are secondary evidence."
- id: "TESTS"
  limitation: "Repository tool access supports GitHub reads/writes, not a local network-connected checkout; report actual verification and CI outcome only."
deliverables:
- "Root LANGUAGE.md with exact 2026-10-17 candidate content and status preserved"
- "Existing AGENTS.md amended with provided product-language section, retaining all previous requirements"
- "Pinned committed ContextPack0010 before effective agent-language change and EB0010 recording actual checks"
- "Draft PR for owner disposition; no merge or deployment"
acceptance_criteria:
- "LANGUAGE.md complete at repository root, no truncation, status proposed-owner-review; exact content hash/size verifiable"
- "AGENTS.md retains previous text and inserts only bounded language instructions; original executor/owner chain unchanged"
- "Only specified documentation and related Task/ContextPack/ExecutionBundle artifacts changed"
- "CP0010 is pinned to committed task and source blobs before implementation; no simulated independent dispatch"
- "No claims of passing tests/CI, owner adoption, merged work or deployed UI without actual evidence"
allowed_actions:
- "Create isolated branch and scoped Task/CP/EB records"
- "Use GitHub connector to commit owner-provided language document and integrate existing AGENTS.md"
- "Verify paths, hashes, diffs and observable CI where available; open a draft PR"
approval_required_for:
- "Owner semantic approval of proposed new terminology and unresolved decisions"
- "Owner's final PR merge/adoption decision"
- "App/CI/SQL/runtime changes, release, paid services, cloud operations, secrets or changes to agent executor policy beyond the scoped document integration"
