source_gaps:
- id: IDENTITY
  limitation: GitHub authors/model strings and coordinator comments cannot prove human
    or LLM identity; protected owner review required.
- id: PRIMARY
  limitation: Original44-item checklist/earlier approval permalinks unavailable; direct
    current dispatch distinct.
- id: BOOTSTRAP
  limitation: First adoption base lacks checker; pinned one-baseline provisional bootstrap
    requires owner review; no claim of protected enforcement.
- id: HOSTED
  limitation: Hosted acceptance NOT_RUN, third migration unapproved, JWT risk unresolved;
    do not perform cloud operations.
deliverables:
- Committed sources/task then generated validated immutable CP0010 before code
- Tiny compliance policy/base-anchored static checker, existing CI/gate integration,
  comprehensive synthetic negative/positive Git tests
- Canonical EB0010, actual commands/results, changed-path/auth/attack matrices, draft
  PR and exact-head CI ledger
acceptance_criteria:
- Qualifying missing/malformed task/pack/EB/scope/provenance cannot yield merge-eligible
  green; docs exemptions narrow and tested
- Immutable pins/source/base and phase scopes enforced; inherited origins and model/executor
  declarations explicit without cryptographic identity claims
- Draft gate stays blocked; ready/main/full security/recovery and manual historical
  workflows preserved
- Self-editing controls, deleted tests and missing-check discovery tested against
  base verifier; bootstrap disclosed, no circular task impossibility
- Owner acceptance separate from advisory review/CI; no spoofed role/migration approval
  or task reassignment broadens sensitive actions
- All issue/handoff negative cases tested in disposable local Git fixtures; actual
  local and final-head CI evidence recorded
allowed_actions:
- Read live issues/PRs/main and effective contracts
- Commit Task0010 and snapshots; generate/validate/commit immutable CP0010 before
  edits
- Implement only explicit allowlist in isolated branch; run focused and existing consolidated
  CI including full disposable verification
- Create draft PR and technical evidence ledger; report exact SHA for independent
  review
approval_required_for:
- Owner adoption/merge, branch protection/settings, alternate executor or scope expansion
- Any hosted/SQL migration execution/private data/paid/release/admin action
