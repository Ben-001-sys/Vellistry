source_gaps:
- id: ISOLATION
  limitation: Fresh process and supplied bytes can be recorded; no forensic guarantee
    of provider hidden state. Historical pack source gaps remain historical.
- id: ACCEPTANCE
  limitation: Owner acceptance remains unset; code review and Level B reasoning are
    not independent end-to-end implementation.
deliverables:
- Committed unique task and validated immutable operator ContextPack before execution
- Exact validated two-file export, hashes, fresh session metadata and verbatim response
- Ten-criterion evidence scorecard with factual limitations and unset owner approval
- ExecutionBundle, actual validators and distinct trusted review with ready/post-main
  CI before delegated integration
acceptance_criteria:
- Evaluated agent receives only exact CP0001 and minimal PROMPT; no current repository,
  authoring chat, rubric, prior output or Task0040 pack
- Record actual process/session/model, exact stdin and unedited output; no invented
  tests, source authentication or human approval
- Score all ten protocol criteria with quoted evidence and limitations; preserve prior
  evaluations and item27 restrictions
- Validate packet provenance, metadata, handoff and applicable CI; no operative source
  or security policy changes
allowed_actions:
- Read approved repository history; create task and immutable operator pack
- Export validated historical packet and dispatch fresh trusted input-only session
  in isolated temporary directory with project docs and memories disabled; no tool
  use requested
- Preserve exact inputs/output, evaluate after completion, report technical evidence
  and separately gated acceptance
- Publish evidence through reviewed repository-only PR under existing delegation
approval_required_for:
- Actual owner acceptance of historical Level B; do not populate approval fields from
  AI evaluation
- All existing hosted/private/paid/SQL/settings/feature boundaries; independent review
  and applicable CI mandatory
