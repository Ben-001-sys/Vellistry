acceptance_criteria:
- Run every original case and5extensions with actual PASS/FAIL/BLOCKED and subcase
  evidence, never edit historical NOT_RUN case source
- Private execute-only gateway; forced/scoped RLS; NOLOGIN/NOBYPASSRLS function and
  lock owners; narrow UPDATE(id) only for locked tables; runtime direct/helper/role/schema/DML/TRUNCATE/REFERENCES/TRIGGER
  privileges denied
- Injected principal verified before and after async operations; session/book locks
  check expiry/freshness after acquisition; revoked synthetic sessions deny; no provider
  guarantee
- P01..P06 strict fields/Unicode/UTF16/bytes/capacity/safe versions; atomic canonical
  blankchapter+revision1; stable IDs; isolated notes; collision-safe dense reorder;
  manuscript/revision invariance
- Exact owner+operation journal with DB-verified canonical SHA256, CAS/conflict/replay
  and durable rejection; unknown prevents ordinary new-key retry; receipt+minimum-version
  owned readback required
- Two restricted clients with real lock barriers/fault rollback; lost acknowledgement,
  process/database restart and independent restore; own-resource cleanup only; scrub
  credentials/log content
- No production routes/Auth/dependency/CI/shipping migrations; original two migrations
  exact; no third migration adoption. Feature PR never auto-merged
