source_gaps:
- id: SYNTHETIC-ONLY
  limitation: Injected response correlation is not JWT verification, real session revocation, writable-session
    proof or hosted acceptance.
- id: CI-SELECTION
  limitation: Existing fixed-file CI does not select the new adapter spec; explicit local execution
    required, no CI change authorized.
deliverables:
- Committed validated immutable Task56/CP56 before code
- Two-file adapter and synthetic tests with PB01-10 evidence
- Actual frozen install/focused/regressions/build/typecheck/governance checks, EB/provenance
- Distinct exact-head review, actual readyCI and new PR for separate owner merge
acceptance_criteria:
- 'PB-01: Valid injected same-token user/claims produces immutable principal under existing types/freshness
  policy'
- 'PB-02: Missing token or verification failure/errors/malformed response denies; no decoded token
  fallback'
- 'PB-03: Verified userId must equal verified claims subject; invalid/missing session id denies'
- 'PB-04: Expired token, stale/future verifiedAt and invalid/nonfinite timestamps deny without relaxing
  existing checkedPrincipal'
- 'PB-05: Concurrent and out-of-order requests for two authors remain isolated; verifier receives
  only its own immutable request token'
- 'PB-06: Token switch/mismatched verification correlation denies; refresh creates a new request-scoped
  provider, never mutates another'
- 'PB-07: Post-async verification rechecks time and identity; caller cannot mutate returned principal
  or influence another request'
- 'PB-08: Unit tests use injected synthetic verification responses and clock only, no network/database/environment
  credentials/JWT signing'
- 'PB-09: No module registration/controller/route/pool/SQL/managed-session privileges/real Auth implementation;
  no dependency or CI changes'
- 'PB-10: Existing12focused/32PG and all applicable governance/security/recovery gates remain unchanged;
  distinct review and separate owner feature merge'
- All existing production/application/Auth/SQL/CI/dependency sources unchanged; original54/55 and
  all historical evidence preserved
allowed_actions:
- Read pinned sources and implement only scoped files after committed validated pack and successful
  post-main CI
- Run frozen tools, injected synthetic tests, builds/typechecks/governance; actual inherited disposable
  CI only
- Submit Draft PR, obtain distinct trusted review, promote Ready and verify exact-head CI; no merge
approval_required_for:
- Any Auth/production/hosted/SQL/CI/dependency/scope change; real security choices; feature PR merge
