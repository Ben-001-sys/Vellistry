source_gaps:
- id: BACKEND-TRUST
  limitation: Frontend MFA is not authorization. PRINCIPAL conditional; SESSION/N12
    blocked; target configuration/factor completeness unverified.
- id: HOSTED-NOT-RUN
  limitation: No hosted execution or fixtures; all3 prerequisites UNKNOWN; R01-R08
    NOT_RUN, historical EPERM BLOCKED.
deliverables:
- Scoped controller, reused login, explicit enrollment screen and synthetic tests
- Immutable CP before code, EB/provenance/raw execution/source review and Draft PR
- Ready only after actual evidence and CI; separate owner merge
acceptance_criteria:
- Reuse existing browser client and preserve signup/library/backend/auth boundaries
- Enrolled AAL1 must challenge and verify; unsupported/malformed/unavailable/contradictory
  state fails closed
- Explicit TOTP enrollment and challenge/verify, transient QR/secret only; no raw
  errors or unsafe SVG insertion
- Handle duplicate submission, pending, errors, incomplete/unknown enrollment and
  stale identity/session responses
- Deterministic offline controller/component tests including accessibility/focus/copy
  and negative cases
- Run focused/existing tests, frozen install/build/typechecks/governance, distinct
  exact-head source review and actual CI
- Keep R01-R08 NOT_RUN, N12/historical EPERM BLOCKED, Issue108 OPEN, owner merge required
allowed_actions:
- Implement only approved paths after committed validated CP
- Run offline synthetic tests and existing CI disposable fixtures; public docs/source
  reads only
- Distinct trusted source review, publish Draft and promote Ready after evidence/CI
approval_required_for:
- PR merge and successor scope
- Any hosted/actual Auth operation or backend policy/security decision
