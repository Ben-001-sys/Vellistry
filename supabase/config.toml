# Vellistry development-only Supabase project; never expose the local stack publicly.
project_id = "vellistry"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]

# Development-only: real email/password test accounts without external mail delivery.
# Production email-verification/security settings are separate release decisions.
[auth.email]
enable_confirmations = false
